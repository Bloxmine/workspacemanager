<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workspace Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/main.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="top-header">
        <div class="spacer"></div>
        <h1 class="title lcars-text">Workspace Manager</h1>
      </header>

      <main class="main-content">
        <aside class="sidebar" aria-label="Workspace navigation">
          <div class="pill pill-top" aria-hidden="true">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 11.5L12 4l9 7.5"></path>
              <path d="M5 10.5V20h14v-9.5"></path>
              <path d="M9 20v-6h6v6"></path>
            </svg>
          </div>

          <div class="pill pill-middle">
            <button id="analyzeBtn" class="sidebar-action" type="button" title="Analyze workspace">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="2" y="5" width="15" height="12" rx="2"></rect>
                <path d="M17 9l5-3v12l-5-3"></path>
              </svg>
            </button>
            <button id="applyActionsBtn" class="sidebar-action" type="button" title="Apply Home Assistant actions" disabled>
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M5 12h14"></path>
                <path d="M13 6l6 6-6 6"></path>
              </svg>
            </button>
            <div class="functions-label lcars-text">Functions</div>
          </div>

          <div class="pill pill-bottom" aria-hidden="true"></div>
        </aside>

        <section class="panel" aria-label="Statistics viewport">
          <div class="panel-label">
            <h2 class="lcars-text">Stats</h2>
          </div>

          <div class="viewport">
            <h2 class="lcars-text">Viewport</h2>
            <div class="camera-wrap" aria-live="polite">
              <div id="cameraCard" class="camera-card" aria-label="Camera feed">
                <div class="camera-card-inner">
                  <div class="camera-face front">
                    <video id="cameraFeed" class="camera-feed camera-front" autoplay muted playsinline></video>
                    <canvas id="detectorOverlay" class="detector-overlay-canvas" aria-hidden="true"></canvas>
                    <div class="camera-overlay">
                      <div class="camera-overlay-top">
                        <span class="camera-chip lcars-text">Live Feed</span>
                        <span id="voiceStatusChip" class="camera-chip voice-chip lcars-text" aria-live="polite">
                          <span class="pulse" aria-hidden="true"></span>
                          <span class="voice-label">Voice idle</span>
                        </span>
                        <button id="replayVoiceBtn" class="camera-chip voice-chip replay-chip lcars-text" type="button" disabled title="Replay the last spoken analysis">
                          <span aria-hidden="true">↻</span>
                          <span>Replay voice</span>
                        </button>
                      </div>
                      <div class="camera-overlay-bottom">
                        <span id="detectorDebugChip" class="camera-chip detector-debug-chip lcars-text">Detector idle</span>
                        <span class="camera-hint lcars-text">Live camera only</span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <p id="cameraStatus" class="camera-status lcars-text">Initializing camera...</p>
          </div>
        </section>
      </main>

      <footer class="bottom-info">
        <div class="spacer"></div>
        <div class="bottom-copy lcars-text output-grid">
          <section class="output-card">
            <h3 class="lcars-text">Assessment</h3>
            <div id="analysisText" class="analysis-text"></div>
          </section>

          <section class="output-card">
            <h3 class="lcars-text">Suggestions</h3>
            <ul id="suggestionsList" class="suggestion-list"></ul>
          </section>

          <section class="output-card">
            <h3 class="lcars-text">Actions</h3>
            <div id="actionsTable" class="actions-table" aria-label="Home Assistant actions"></div>
          </section>
        </div>
      </footer>
    </div>
  </body>
</html>
